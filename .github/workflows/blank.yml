name: Build Mod Jar

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Mod
        run: |
          BUILD_PATH=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
          cd "$BUILD_PATH"
          gradle build --no-daemon

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mod-Jar
          path: "**/build/libs/*.jar"
