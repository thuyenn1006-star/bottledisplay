name: Build Mod Jar

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build Mod
        run: |
          find . -name "gradlew" -exec chmod +x {} \;
          DIR=$(find . -name "build.gradle" -exec dirname {} \;)
          cd "$DIR"
          ./gradlew build
      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mod-Jar
          path: "**/build/libs/*.jar"
